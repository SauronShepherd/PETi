name: backend-quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install -e 'backend[dev]'
      - name: Import smoke test
        run: python -c "import sys; sys.path.insert(0, 'backend'); import app.main; import app.main_worker"
      - name: Compile application
        run: python -m compileall -q backend/app
      - name: Full backend tests
        run: python -m pytest -q backend/tests
      - name: Lab contract and privacy gates
        run: python scripts/check_lab_contracts.py; python scripts/check_lab_privacy.py
      - name: Terraform judge validation
        run: terraform -chdir=infra/terraform/environments/judge init -backend=false -input=false && terraform -chdir=infra/terraform/environments/judge validate
